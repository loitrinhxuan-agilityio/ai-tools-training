# Local development database. One container hosts two databases:
# `banking` for the running app and `banking_test` for integration/e2e tests.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banking -d banking']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
